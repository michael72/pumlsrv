# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Least privilege by default; the dependency-graph job below opts into more.
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn clean package

  # Uploads the full dependency graph to GitHub to improve the quality of the
  # Dependabot alerts this repository can receive.
  #
  # Only runs on pushes to master: submitting a snapshot needs `contents: write`,
  # and on `pull_request` runs triggered by Dependabot the GITHUB_TOKEN is always
  # read-only, so the API call there fails with HTTP 403 "Resource not accessible
  # by integration". The dependency graph tracks the default branch anyway, so
  # there is nothing to submit from a pull request.
  dependency-graph:
    if: github.event_name == 'push'
    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@v6
